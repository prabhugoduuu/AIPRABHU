name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Unpack an uploaded project zip (if there is one)
        run: |
          # only a zip that was JUST uploaded in this commit is unpacked, so old zips can never overwrite newer code
          Z=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- '*.zip' 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$Z" ]; then
            rm -rf /tmp/up && mkdir /tmp/up && unzip -q "$Z" -d /tmp/up
            S=$(find /tmp/up -name settings.gradle.kts | head -n1)
            R=$(dirname "$S")
            rsync -a --exclude='.github' "$R"/ ./
            echo "Building from: $Z"
            rm -f ./*.zip
            git config user.name "prabhu-bot"
            git config user.email "prabhu-bot@users.noreply.github.com"
            git add -A
            git commit -m "Unpacked project zip" || true
            git push || true
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug --no-daemon
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: Prabhu-APK
          path: app/build/outputs/apk/debug/*.apk
